services:
  api:
    container_name: field-sales-api
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - .env.development
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    volumes:
      - ./:/home/field-sales-be
      - api-node-modules:/home/field-sales-be/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: field-sales-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-field_sales}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-field_sales}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  api-node-modules:
  postgres-data:
